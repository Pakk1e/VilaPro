name: Worlds Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worlds/pyproject.toml

      - name: Install Worlds
        run: python -m pip install -e ./worlds

      - name: Run Worlds tests
        working-directory: worlds
        run: python -m unittest discover tests
