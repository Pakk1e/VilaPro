name: VilaPro Frontend CI

on:
  push:
    paths:
      - "frontend-dev/**"
      - ".github/workflows/worlds-tests.yml"
      - ".github/workflows/worlds-backend-tests.yml"
  pull_request:
    paths:
      - "frontend-dev/**"
      - ".github/workflows/worlds-tests.yml"
      - ".github/workflows/worlds-backend-tests.yml"

jobs:
  frontend:
    name: Worlds frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-dev/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
