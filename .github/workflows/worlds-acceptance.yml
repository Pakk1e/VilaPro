name: Worlds Acceptance Tests

on:
  workflow_call:
    inputs:
      branch:
        description: Branch/ref to test when called from the Worlds DEV deployment workflow
        required: false
        default: v0.4/workspace-architecture
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: Branch/ref to test
        required: false
        default: v0.4/workspace-architecture
        type: string

concurrency:
  group: worlds-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    name: Worlds browser acceptance
    runs-on: [self-hosted, worlds-dev]
    environment: worlds-dev
    timeout-minutes: 30
    env:
      BASE_URL: https://worlds-dev.vadovsky-tech.com
      WORLDS_E2E_EMAIL: ${{ secrets.WORLDS_E2E_EMAIL }}
      WORLDS_E2E_PASSWORD: ${{ secrets.WORLDS_E2E_PASSWORD }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Measure runner before acceptance setup
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Worlds acceptance baseline ==="
          echo "Revision: $GITHUB_SHA"
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Started: $(date -Is)"
          echo "Runner: $(hostname)"
          echo "CPU threads: $(nproc 2>/dev/null || true)"
          echo "Load: $(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null || true)"
          free -m 2>/dev/null | awk 'NR==1 || NR==2 {print "Memory: " $0}' || true
          df -h "$GITHUB_WORKSPACE" 2>/dev/null | awk 'NR==1 || NR==2 {print "Disk: " $0}' || true

      - name: Install frontend dependencies
        working-directory: frontend-dev
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s%3N)
          npm ci --prefer-offline --no-audit --no-fund
          ended=$(date +%s%3N)
          echo "npm ci duration=$((ended - started))ms"

      # Keep the Playwright toolchain outside the checkout. actions/checkout
      # cleans node_modules on every run, while this cache survives between
      # runs on the persistent worlds-dev self-hosted runner.
      - name: Ensure persistent Playwright test runner
        working-directory: frontend-dev
        shell: bash
        run: |
          set -euo pipefail
          version="1.63.0"
          cache_root="$HOME/.cache/vilapro-playwright/$version"
          package_root="$cache_root/node_modules/@playwright/test"
          started=$(date +%s%3N)

          if [ ! -f "$package_root/package.json" ]; then
            echo "Playwright $version not present on runner; installing once..."
            mkdir -p "$cache_root"
            npm install \
              --prefix "$cache_root" \
              --no-save \
              --package-lock=false \
              --prefer-offline \
              --no-audit \
              --no-fund \
              "@playwright/test@$version"
          else
            echo "Playwright $version already present on runner; reusing persistent install."
          fi

          rm -rf node_modules/@playwright/test node_modules/playwright node_modules/playwright-core
          mkdir -p node_modules/@playwright node_modules/.bin
          ln -s "$package_root" node_modules/@playwright/test
          ln -s "$cache_root/node_modules/playwright" node_modules/playwright
          ln -s "$cache_root/node_modules/playwright-core" node_modules/playwright-core
          rm -f node_modules/.bin/playwright node_modules/.bin/playwright-core
          ln -s "$cache_root/node_modules/.bin/playwright" node_modules/.bin/playwright
          ln -s "$cache_root/node_modules/.bin/playwright-core" node_modules/.bin/playwright-core

          ended=$(date +%s%3N)
          echo "Playwright runner setup duration=$((ended - started))ms"
          node -e "console.log('Playwright version:', require('@playwright/test/package.json').version)"

      # The persistent worlds-dev runner normally already has Chromium. This is
      # idempotent and should be a no-op when the requested browser revision exists.
      - name: Ensure Playwright Chromium
        working-directory: frontend-dev
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s%3N)
          npx playwright install chromium
          ended=$(date +%s%3N)
          echo "Chromium ensure duration=$((ended - started))ms"
          npx playwright --version

      - name: Run complete acceptance suite
        working-directory: frontend-dev
        shell: bash
        run: |
          set -o pipefail
          started=$(date +%s%3N)
          workers="${WORLDS_E2E_WORKERS:-3}"
          echo "=== Worlds browser acceptance ==="
          echo "Revision: $GITHUB_SHA"
          echo "Workers:  $workers"
          echo "Started:  $(date -Is)"
          npx playwright test tests/e2e/acceptance.spec.js --workers="$workers" --reporter=list,html --retries=0 2>&1 | tee ../acceptance-run.log
          status=${PIPESTATUS[0]}
          ended=$(date +%s%3N)
          echo "Finished: $(date -Is)"
          echo "Duration: $((ended - started))ms"
          exit "$status"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-report
          path: frontend-dev/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload acceptance UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-screenshots
          path: testscreenshots/playwright
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-failures
          path: |
            acceptance-run.log
            frontend-dev/test-results
            frontend-dev/playwright-report
            testscreenshots/playwright
          if-no-files-found: ignore
          retention-days: 14
