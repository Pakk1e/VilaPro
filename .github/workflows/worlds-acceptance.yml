name: Worlds Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch/ref to test
        required: false
        default: v0.4/workspace-architecture
  workflow_run:
    workflows:
      - Deploy Worlds DEV
    types:
      - completed

concurrency:
  group: worlds-acceptance
  cancel-in-progress: true

jobs:
  acceptance:
    name: Worlds browser acceptance
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'v0.4/workspace-architecture') }}
    runs-on: [self-hosted, worlds-dev]
    environment: worlds-dev
    timeout-minutes: 30
    env:
      BASE_URL: https://worlds-dev.vadovsky-tech.com
      WORLDS_E2E_EMAIL: ${{ secrets.WORLDS_E2E_EMAIL }}
      WORLDS_E2E_PASSWORD: ${{ secrets.WORLDS_E2E_PASSWORD }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_sha }}
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-dev/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-dev
        run: npm ci

      # Keep the acceptance runner aligned with the version used by the deploy
      # workflow. It is intentionally not part of package-lock.json.
      - name: Install Playwright test runner
        working-directory: frontend-dev
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      # The persistent worlds-dev runner normally already has Chromium from the
      # deploy workflow. Without --with-deps this is fast when cached and does
      # not require OS package privileges.
      - name: Ensure Playwright Chromium
        working-directory: frontend-dev
        run: npx playwright install chromium

      - name: Run acceptance tests
        working-directory: frontend-dev
        shell: bash
        run: |
          set +e
          # Fail fast while iterating: a failing test makes the run non-green,
          # so there is no value in spending another 10–20 minutes on the
          # remaining tests. A fully green run still executes the entire suite.
          npx playwright test tests/e2e/acceptance.spec.js --reporter=list,html --retries=0 --max-failures=1 2>&1 | tee ../acceptance-run.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-report
          path: frontend-dev/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload acceptance UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-screenshots
          path: testscreenshots/playwright
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-failures
          path: |
            acceptance-run.log
            frontend-dev/test-results
            frontend-dev/playwright-report
            testscreenshots/playwright
          if-no-files-found: ignore
          retention-days: 14
