name: Worlds Acceptance Tests

on:
  workflow_call:
    inputs:
      branch:
        description: Branch/ref to test when called from the Worlds DEV deployment workflow
        required: false
        default: v0.4/workspace-architecture
        type: string
      revision:
        description: Exact deployed commit to test
        required: false
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: Branch/ref to test
        required: false
        default: v0.4/workspace-architecture
        type: string
      revision:
        description: Optional exact commit to test; when omitted, the branch is used
        required: false
        type: string

concurrency:
  group: worlds-acceptance-${{ inputs.branch || github.ref_name }}-${{ inputs.revision || 'branch' }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Worlds browser acceptance
    runs-on: [self-hosted, worlds-dev]
    environment: worlds-dev
    timeout-minutes: 30
    env:
      BASE_URL: https://worlds-dev.vadovsky-tech.com
      WORLDS_E2E_EMAIL: ${{ secrets.WORLDS_E2E_EMAIL }}
      WORLDS_E2E_PASSWORD: ${{ secrets.WORLDS_E2E_PASSWORD }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || inputs.branch || github.sha }}
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Measure runner before acceptance setup
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Worlds acceptance baseline ==="
          echo "Revision requested: ${{ inputs.revision || inputs.branch || github.sha }}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "Started: $(date -Is)"
          echo "Runner: $(hostname)"
          echo "CPU threads: $(nproc 2>/dev/null || true)"
          echo "Load: $(cut -d' ' -f1-3 /proc/loadavg 2>/dev/null || true)"
          free -m 2>/dev/null | awk 'NR==1 || NR==2 {print "Memory: " $0}' || true
          df -h "$GITHUB_WORKSPACE" 2>/dev/null | awk 'NR==1 || NR==2 {print "Disk: " $0}' || true

      - name: Prepare acceptance suite for schematic-first workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f frontend-dev/src/applications/worlds/components/ElectricalWorkspaceShell.jsx ]; then
            echo "Legacy Worlds workspace detected; no UI rework compatibility patch required."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          root = Path('frontend-dev/tests/e2e')
          for path in root.glob('*.spec.js'):
              text = path.read_text()
              text = text.replace('page.getByRole("button", { name: /Simulate/ })', 'page.getByTestId("simulate-button")')
              text = text.replace('page.getByRole("button", { name: "Start Live" })', 'page.getByTestId("simulate-button")')
              path.write_text(text)
          path = root / 'acceptance.spec.js'
          text = path.read_text()
          text = text.replace('const left = canvasBox.x + 80; const right = paletteBox.x - 80; const width = right - left; if (width < 300) throw new Error("Insufficient canvas width for acceptance circuit.");', 'const paletteRight = paletteBox.x + paletteBox.width; const left = Math.max(canvasBox.x + 40, paletteRight + 40); const right = canvasBox.x + canvasBox.width - 80; const width = right - left; if (width < 300) throw new Error("Insufficient canvas width for acceptance circuit.");')
          text = text.replace('for (const node of nodes) { const box = await node.boundingBox(); if (!box) throw new Error("Unable to locate circuit component."); expect(box.x + box.width).toBeLessThan(paletteBox.x - 8); }', 'const paletteRight = paletteBox.x + paletteBox.width; for (const node of nodes) { const box = await node.boundingBox(); if (!box) throw new Error("Unable to locate circuit component."); expect(box.x).toBeGreaterThan(paletteRight + 8); }')
          path.write_text(text)
          PY

      - name: Install frontend dependencies
        working-directory: frontend-dev
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s%3N)
          npm ci --prefer-offline --no-audit --no-fund
          ended=$(date +%s%3N)
          echo "npm ci duration=$((ended - started))ms"

      # Keep the Playwright toolchain outside the checkout. actions/checkout
      # cleans node_modules on every run, while this cache survives between
      # runs on the persistent worlds-dev self-hosted runner.
      - name: Ensure persistent Playwright test runner
        working-directory: frontend-dev
        shell: bash
        run: |
          set -euo pipefail
          version="1.63.0"
          cache_root="$HOME/.cache/vilapro-playwright/$version"
          package_root="$cache_root/node_modules/@playwright/test"
          started=$(date +%s%3N)

          if [ ! -f "$package_root/package.json" ]; then
            echo "Playwright $version not present on runner; installing once..."
            mkdir -p "$cache_root"
            npm install \
              --prefix "$cache_root" \
              --no-save \
              --package-lock=false \
              --prefer-offline \
              --no-audit \
              --no-fund \
              "@playwright/test@$version"
          else
            echo "Playwright $version already present on runner; reusing persistent install."
          fi

          rm -rf node_modules/@playwright/test node_modules/playwright node_modules/playwright-core
          mkdir -p node_modules/@playwright node_modules/.bin
          ln -s "$package_root" node_modules/@playwright/test
          ln -s "$cache_root/node_modules/playwright" node_modules/playwright
          ln -s "$cache_root/node_modules/playwright-core" node_modules/playwright-core
          rm -f node_modules/.bin/playwright node_modules/.bin/playwright-core
          ln -s "$cache_root/node_modules/.bin/playwright" node_modules/.bin/playwright
          ln -s "$cache_root/node_modules/.bin/playwright-core" node_modules/.bin/playwright-core

          ended=$(date +%s%3N)
          echo "Playwright runner setup duration=$((ended - started))ms"
          node -e "console.log('Playwright version:', require('@playwright/test/package.json').version)"

      - name: Ensure Playwright Chromium
        working-directory: frontend-dev
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s%3N)
          npx playwright install chromium
          ended=$(date +%s%3N)
          echo "Chromium ensure duration=$((ended - started))ms"
          npx playwright --version

      - name: Run complete acceptance suite
        working-directory: frontend-dev
        shell: bash
        run: |
          set -o pipefail
          started=$(date +%s%3N)
          workers="${WORLDS_E2E_WORKERS:-3}"
          echo "=== Worlds browser acceptance ==="
          echo "Requested revision: ${{ inputs.revision || inputs.branch || github.sha }}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Workers:  $workers"
          echo "Started:  $(date -Is)"
          npx playwright test tests/e2e/*acceptance.spec.js --workers="$workers" --reporter=list,html --retries=0 --trace=retain-on-failure 2>&1 | tee ../acceptance-run.log
          status=${PIPESTATUS[0]}
          ended=$(date +%s%3N)
          echo "Finished: $(date -Is)"
          echo "Duration: $((ended - started))ms"
          exit "$status"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-report
          path: frontend-dev/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload acceptance UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-screenshots
          path: testscreenshots/playwright
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worlds-acceptance-failures
          path: |
            acceptance-run.log
            frontend-dev/test-results
            frontend-dev/playwright-report
            testscreenshots/playwright
          if-no-files-found: ignore
          retention-days: 14
