name: One-time UI acceptance repair
on:
  push:
    branches: [v0.4/electrical-ui-rework]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'ci: repair UI acceptance compatibility') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair acceptance tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('frontend-dev/tests/e2e')
          for path in root.glob('*.spec.js'):
              text = path.read_text()
              text = text.replace('page.getByRole("button", { name: /Simulate/ })', 'page.getByTestId("simulate-button")')
              text = text.replace('page.getByRole("button", { name: "Start Live" })', 'page.getByTestId("simulate-button")')
              path.write_text(text)
          path = root / 'acceptance.spec.js'
          text = path.read_text()
          old = 'const left = canvasBox.x + 80; const right = paletteBox.x - 80; const width = right - left; if (width < 300) throw new Error("Insufficient canvas width for acceptance circuit.");'
          new = 'const paletteRight = paletteBox.x + paletteBox.width; const left = Math.max(canvasBox.x + 40, paletteRight + 40); const right = canvasBox.x + canvasBox.width - 80; const width = right - left; if (width < 300) throw new Error("Insufficient canvas width for acceptance circuit.");'
          if old not in text:
              raise SystemExit('Expected createSeriesCircuit placement expression not found')
          text = text.replace(old, new)
          old = 'for (const node of nodes) { const box = await node.boundingBox(); if (!box) throw new Error("Unable to locate circuit component."); expect(box.x + box.width).toBeLessThan(paletteBox.x - 8); }'
          new = 'const paletteRight = paletteBox.x + paletteBox.width; for (const node of nodes) { const box = await node.boundingBox(); if (!box) throw new Error("Unable to locate circuit component."); expect(box.x).toBeGreaterThan(paletteRight + 8); }'
          if old not in text:
              raise SystemExit('Expected palette assertion not found')
          text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend-dev/tests/e2e
          git commit -m 'ci: repair UI acceptance compatibility' || exit 0
          git push
