name: Deploy Worlds DEV

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Worlds branch to deploy
        required: true
        default: v0.4/workspace-architecture
        type: string

jobs:
  deploy:
    name: Deploy Worlds DEV
    runs-on:
      - self-hosted
      - worlds-dev
    environment: worlds-dev

    steps:
      - name: Deploy Worlds DEV
        env:
          WORLDS_DEPLOY_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [[ ! "$WORLDS_DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "ERROR: invalid branch name: $WORLDS_DEPLOY_BRANCH" >&2
            exit 1
          fi

          cd /home/park-pro/VilaPro
          echo "=== Worlds DEV deployment ==="
          echo "Repository: /home/park-pro/VilaPro"
          echo "Branch:     $WORLDS_DEPLOY_BRANCH"

          git fetch origin "$WORLDS_DEPLOY_BRANCH"
          git checkout "$WORLDS_DEPLOY_BRANCH"
          git pull --ff-only origin "$WORLDS_DEPLOY_BRANCH"

          bash scripts/deploy-worlds-dev.sh

      - name: Install Playwright test runner
        working-directory: /home/park-pro/VilaPro/frontend-dev
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium for browser tests
        working-directory: /home/park-pro/VilaPro/frontend-dev
        run: npx playwright install --with-deps chromium

      - name: Run Worlds browser smoke tests
        working-directory: /home/park-pro/VilaPro/frontend-dev
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: https://worlds-dev.vadovsky-tech.com
        run: npx playwright test

      - name: Upload browser test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: worlds-dev-browser-test-artifacts
          path: |
            /home/park-pro/VilaPro/testscreenshots/
            /home/park-pro/VilaPro/playwright-report/
          if-no-files-found: warn
          retention-days: 14
