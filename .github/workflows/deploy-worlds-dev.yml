name: Deploy Worlds DEV

on:
  push:
    branches:
      - v0.4/workspace-architecture
      - v0.4/electrical-ui-rework
  workflow_dispatch:
    inputs:
      branch:
        description: Worlds branch to deploy
        required: true
        default: v0.4/workspace-architecture
        type: string

concurrency:
  group: worlds-dev-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worlds DEV
    runs-on:
      - self-hosted
      - worlds-dev
    environment: worlds-dev
    outputs:
      deployed_sha: ${{ steps.deploy_worlds.outputs.deployed_sha }}

    steps:
      - name: Deploy Worlds DEV
        id: deploy_worlds
        env:
          WORLDS_DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$WORLDS_DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "ERROR: invalid branch name: $WORLDS_DEPLOY_BRANCH" >&2
            exit 1
          fi

          cd /home/park-pro/VilaPro
          echo "=== Worlds DEV deployment ==="
          echo "Repository: /home/park-pro/VilaPro"
          echo "Branch:     $WORLDS_DEPLOY_BRANCH"

          git fetch origin "$WORLDS_DEPLOY_BRANCH"
          git checkout "$WORLDS_DEPLOY_BRANCH"
          git pull --ff-only origin "$WORLDS_DEPLOY_BRANCH"

          deployed_sha="$(git rev-parse HEAD)"
          echo "Deployed commit: $deployed_sha"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"

          bash scripts/deploy-worlds-dev.sh

  acceptance:
    name: Worlds browser acceptance
    needs: deploy
    uses: ./.github/workflows/worlds-acceptance.yml
    with:
      branch: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      revision: ${{ needs.deploy.outputs.deployed_sha }}
    secrets: inherit
