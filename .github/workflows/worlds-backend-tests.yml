name: VilaPro Worlds Backend CI

on:
  push:
    paths:
      - "worlds/**"
      - ".github/workflows/worlds-backend-tests.yml"
  pull_request:
    paths:
      - "worlds/**"
      - ".github/workflows/worlds-backend-tests.yml"

jobs:
  worlds:
    name: Worlds backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worlds/pyproject.toml

      - name: Install Worlds
        run: python -m pip install -e ./worlds

      - name: Validate Python syntax
        run: python -m compileall -q worlds/src worlds/tests

      - name: Install coverage
        run: python -m pip install coverage

      - name: Run Worlds tests with coverage
        working-directory: worlds
        run: python -m coverage run --source=src -m unittest discover tests

      - name: Generate coverage report
        working-directory: worlds
        run: |
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Upload Worlds coverage
        uses: actions/upload-artifact@v4
        with:
          name: worlds-coverage
          path: worlds/coverage.xml
